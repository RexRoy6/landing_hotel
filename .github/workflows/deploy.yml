name: Deploy HTML to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug SSH Key
      run: |
        echo "SSH Key:"
        echo "${{ secrets.VPS_SSH_KEY }}"
        echo "---"
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
        echo "Key file content:"
        cat ~/.ssh/deploy_key
        echo "---"
        chmod 600 ~/.ssh/deploy_key
        
    - name: Test SSH Key
      run: |
        ssh-keygen -l -f ~/.ssh/deploy_key